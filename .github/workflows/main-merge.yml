name: Main merge
on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  android_build_test_and_distribute:
    name: Android - Build, Test and Distribute
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: writeopia
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      isCI: "true"
      IN_MEMORY_DATABASE: 'true'
      DB_USER: 'postgres'
      WRITEOPIA_FIREBASE_ID: 'id'
      WRITEOPIA_CLIENT_BASE_URL: "baseurl"
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY_CI }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY_CI }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: adopt
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Wait for Postgres to be healthy
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 && echo "Postgres is ready" && break
            echo "Waiting for postgres..." && sleep 5
          done
      - name: Run SQL init script
        run: |
          sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d writeopia -f ./docker/postgres/init.sql
        env:
          PGPASSWORD: postgres
      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > application/androidApp/google-services.json
      - name: Build and test
        run: ./gradlew :application:androidApp:assembleDebug test
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT }}
          groups: testers
          file: application/androidApp/build/outputs/apk/debug/androidApp-debug.apk
          releaseNotes: |
            Automated build from commit ${{ github.sha }}
            Branch: ${{ github.ref_name }}
      - name: Cleanup google-services.json
        if: always()
        run: rm -f application/androidApp/google-services.json
  desktop_build_and_test:
    name: Desktop - Build, Test and Publish
    runs-on: macos-14
    env:
      isCI: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: adopt
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: import certs
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASSWORD }}
      - name: Generate signed mac app
        run: ./gradlew packageReleaseDmg
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
      - name: Main test
        run: ./gradlew jvmTest
  web_build_and_publish:
    name: Web - Build and Publish
    runs-on: ubuntu-22.04
    env:
      isCI: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: adopt
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build development webpack
        run: ./gradlew jsBrowserDevelopmentWebpack
      - name: Upload JS webpack
        uses: actions/upload-artifact@v7
        with:
          name: writeopia-js-webpack
          path: ./application/web/build/kotlin-webpack/js/developmentExecutable
          if-no-files-found: error
          retention-days: 10
          overwrite: true
