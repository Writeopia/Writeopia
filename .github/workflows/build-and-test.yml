name: Build and test

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}

jobs:
  kt_lint:
    name: Ktlint
    runs-on: ubuntu-22.04
    env:
      isCI: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Ktlint
        run: ./gradlew ktlintCheck
  mac_app_build:
    name: Mac App Build
    runs-on: ubuntu-22.04
    env:
      isCI: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Generate signed mac app
        run: ./gradlew packageReleaseDmg
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
  ui_jvm_tests:
    name: Jvm UI Compose tests
    runs-on: ubuntu-22.04
    env:
      isCI: "true"
      IN_MEMORY_DATABASE: 'true'
      DB_USER: 'postgres'
      WRITEOPIA_FIREBASE_ID: 'id'
      WRITEOPIA_CLIENT_BASE_URL: "baseurl"
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY_CI }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY_CI }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Generate ephemeral JWT keys (fork PRs have no secrets)
        if: env.JWT_PRIVATE_KEY == ''
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/jwt.key"
          openssl rsa -in "$RUNNER_TEMP/jwt.key" -pubout -out "$RUNNER_TEMP/jwt.pub"
          { echo 'JWT_PRIVATE_KEY<<EOF'; cat "$RUNNER_TEMP/jwt.key"; echo 'EOF'; } >> "$GITHUB_ENV"
          { echo 'JWT_PUBLIC_KEY<<EOF'; cat "$RUNNER_TEMP/jwt.pub"; echo 'EOF'; } >> "$GITHUB_ENV"
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: JVM tests
        run: ./gradlew jvmTest
      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-jvm
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
  general_build:
    name: General - Build debug
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: writeopia
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      isCI: "true"
      IN_MEMORY_DATABASE: 'true'
      DB_USER: 'postgres'
      WRITEOPIA_FIREBASE_ID: 'id'
      WRITEOPIA_CLIENT_BASE_URL: "baseurl"
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY_CI }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY_CI }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Generate ephemeral JWT keys (fork PRs have no secrets)
        if: env.JWT_PRIVATE_KEY == ''
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/jwt.key"
          openssl rsa -in "$RUNNER_TEMP/jwt.key" -pubout -out "$RUNNER_TEMP/jwt.pub"
          { echo 'JWT_PRIVATE_KEY<<EOF'; cat "$RUNNER_TEMP/jwt.key"; echo 'EOF'; } >> "$GITHUB_ENV"
          { echo 'JWT_PUBLIC_KEY<<EOF'; cat "$RUNNER_TEMP/jwt.pub"; echo 'EOF'; } >> "$GITHUB_ENV"
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Wait for Postgres to be healthy
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 && echo "Postgres is ready" && break
            echo "Waiting for postgres..." && sleep 5
          done
      - name: Run SQL init script
        run: |
          sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d writeopia -f ./docker/postgres/init.sql
        env:
          PGPASSWORD: postgres
      - name: Build debug
        run: ./gradlew assembleDebug test
      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-general
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
  ios_build:
    name: iOS build
    runs-on: ubuntu-22.04
    env:
      isCI: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build debug
        run: ./gradlew compileKotlinIosArm64
  backend_build_and_test:
    name: Backend - build
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: writeopia
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      isCI: "true"
      IN_MEMORY_DATABASE: 'true'
      DB_USER: 'postgres'
      WRITEOPIA_FIREBASE_ID: 'id'
      WRITEOPIA_CLIENT_BASE_URL: "baseurl"
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY_CI }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY_CI }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Generate ephemeral JWT keys (fork PRs have no secrets)
        if: env.JWT_PRIVATE_KEY == ''
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/jwt.key"
          openssl rsa -in "$RUNNER_TEMP/jwt.key" -pubout -out "$RUNNER_TEMP/jwt.pub"
          { echo 'JWT_PRIVATE_KEY<<EOF'; cat "$RUNNER_TEMP/jwt.key"; echo 'EOF'; } >> "$GITHUB_ENV"
          { echo 'JWT_PUBLIC_KEY<<EOF'; cat "$RUNNER_TEMP/jwt.pub"; echo 'EOF'; } >> "$GITHUB_ENV"
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Wait for Postgres to be healthy
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 && echo "Postgres is ready" && break
            echo "Waiting for postgres..." && sleep 5
          done
      - name: Run SQL init script
        run: |
          sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d writeopia -f ./docker/postgres/init.sql
        env:
          PGPASSWORD: postgres
      - name: Build backend
        run: ./gradlew :backend:gateway:assemble
      - name: Test backend
        run: >-
          ./gradlew
          :backend:gateway:test
          :backend:core:ai:test
          :backend:core:auth:test
          :backend:core:genai_service:test
          :backend:documents:documents:test
          :backend:editor:api_editor_socket:test
          :backend:micro:auth:test
          :backend:micro:media:test
      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-backend
          path: |
            backend/**/build/reports/tests/
            backend/**/build/test-results/
          retention-days: 7
  web_build:
    name: Web - Build debug
    runs-on: ubuntu-22.04
    env:
      isCI: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build web debug
        run: |
          ./gradlew kotlinUpgradeYarnLock
          ./gradlew jsBrowserDevelopmentWebpack
  test_docusaurus:
    name: Test docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: documentation/writeopia_docs/package-lock.json
      - name: Install dependencies
        working-directory: ./documentation/writeopia_docs
        run: npm ci
      - name: Test build website
        working-directory: ./documentation/writeopia_docs
        run: npm run build
  ios_native_changes:
    name: iOS native - detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ios:
              - 'iosAppNat/**'
              - '.github/workflows/build-and-test.yml'
  ios_native:
    name: iOS native - build and test
    needs: ios_native_changes
    # Skipped (which counts as passing) when the pull request doesn't touch the native app.
    if: needs.ios_native_changes.outputs.ios == 'true'
    # The app uses the iOS 26 SDK (Liquid Glass) and Swift 6.2 packages.
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: iosAppNat
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show tool versions
        run: |
          xcodebuild -version
          swift --version

      - name: Pick an iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          iphones = [
              (runtime, device)
              for runtime, items in devices.items() if "iOS" in runtime
              for device in items if device["name"].startswith("iPhone")
          ]
          # The newest iOS runtime first.
          iphones.sort(key=lambda item: [int(p) for p in item[0].split("iOS-")[-1].split("-") if p.isdigit()], reverse=True)
          print(iphones[0][1]["udid"])
          ')
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Core package tests
        working-directory: iosAppNat/Packages/Core
        run: swift test

      - name: Editor package tests
        working-directory: iosAppNat/Packages/Editor
        run: >-
          xcodebuild test
          -scheme Editor-Package
          -destination "id=${{ steps.simulator.outputs.udid }}"
          -derivedDataPath "$RUNNER_TEMP/editor"
          CODE_SIGNING_ALLOWED=NO

      - name: Features package tests
        working-directory: iosAppNat/Packages/Features
        run: >-
          xcodebuild test
          -scheme Features-Package
          -destination "id=${{ steps.simulator.outputs.udid }}"
          -derivedDataPath "$RUNNER_TEMP/features"
          CODE_SIGNING_ALLOWED=NO

      - name: Build app
        run: >-
          xcodebuild build
          -project iosAppNat.xcodeproj
          -scheme iosAppNat
          -destination "id=${{ steps.simulator.outputs.udid }}"
          -derivedDataPath "$RUNNER_TEMP/app"
          CODE_SIGNING_ALLOWED=NO
