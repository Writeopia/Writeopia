name: Build and test

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}

jobs:
  kt_lint:
    name: Ktlint
    runs-on: ubuntu-22.04
    env:
      isCI: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Ktlint
        run: ./gradlew ktlintCheck
  mac_app_build:
    name: Mac App Build
    runs-on: ubuntu-22.04
    env:
      isCI: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Generate signed mac app
        run: ./gradlew packageReleaseDmg
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
  ui_jvm_tests:
    name: Jvm UI Compose tests
    runs-on: ubuntu-22.04
    env:
      isCI: "true"
      IN_MEMORY_DATABASE: 'true'
      DB_USER: 'postgres'
      WRITEOPIA_FIREBASE_ID: 'id'
      WRITEOPIA_CLIENT_BASE_URL: "baseurl"
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY_CI }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY_CI }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: JVM tests
        run: ./gradlew jvmTest
      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-jvm
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
  general_build:
    name: General - Build debug
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: writeopia
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      isCI: "true"
      IN_MEMORY_DATABASE: 'true'
      DB_USER: 'postgres'
      WRITEOPIA_FIREBASE_ID: 'id'
      WRITEOPIA_CLIENT_BASE_URL: "baseurl"
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY_CI }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY_CI }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Wait for Postgres to be healthy
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 && echo "Postgres is ready" && break
            echo "Waiting for postgres..." && sleep 5
          done
      - name: Run SQL init script
        run: |
          sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d writeopia -f ./docker/postgres/init.sql
        env:
          PGPASSWORD: postgres
      - name: Build debug
        run: ./gradlew assembleDebug test
      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-general
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
  ios_build:
    name: iOS build
    runs-on: ubuntu-22.04
    env:
      isCI: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build debug
        run: ./gradlew compileKotlinIosArm64
  backend_build_and_test:
    name: Backend - build
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: writeopia
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      isCI: "true"
      IN_MEMORY_DATABASE: 'true'
      DB_USER: 'postgres'
      WRITEOPIA_FIREBASE_ID: 'id'
      WRITEOPIA_CLIENT_BASE_URL: "baseurl"
      JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY_CI }}
      JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY_CI }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Wait for Postgres to be healthy
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 && echo "Postgres is ready" && break
            echo "Waiting for postgres..." && sleep 5
          done
      - name: Run SQL init script
        run: |
          sudo apt-get install -y postgresql-client
          psql -h localhost -U postgres -d writeopia -f ./docker/postgres/init.sql
        env:
          PGPASSWORD: postgres
      - name: Build backend
        run: ./gradlew :backend:gateway:assemble
      - name: Test backend
        run: ./gradlew :backend:gateway:test
      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-backend
          path: |
            backend/**/build/reports/tests/
            backend/**/build/test-results/
          retention-days: 7
  web_build:
    name: Web - Build debug
    runs-on: ubuntu-22.04
    env:
      isCI: "true"
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build web debug
        run: |
          ./gradlew kotlinUpgradeYarnLock
          ./gradlew jsBrowserDevelopmentWebpack
  android_espresso_tests:
    name: Android Espresso Tests
    runs-on: ubuntu-22.04
    env:
      isCI: "true"
      IN_MEMORY_DATABASE: 'true'
      WRITEOPIA_FIREBASE_ID: 'id'
      WRITEOPIA_CLIENT_BASE_URL: "baseurl"
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > application/androidApp/google-services.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Espresso tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          heap-size: 512M
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :application:composeApp:connectedDebugAndroidTest
      - name: Cleanup google-services.json
        if: always()
        run: rm -f application/androidApp/google-services.json
      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: espresso-test-results
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 7
  test_docusaurus:
    name: Test docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: documentation/writeopia_docs/package-lock.json
      - name: Install dependencies
        working-directory: ./documentation/writeopia_docs
        run: npm ci
      - name: Test build website
        working-directory: ./documentation/writeopia_docs
        run: npm run build


