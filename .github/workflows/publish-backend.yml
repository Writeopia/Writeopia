name: Publish Backend

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'

jobs:
  build:
    name: Build all backend JARs
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: adopt
          java-version: '21'

      - name: Build all backend modules
        run: ./gradlew :backend:gateway:buildFatJar :backend:micro:auth:buildFatJar :backend:micro:documents:buildFatJar :backend:micro:media:buildFatJar :backend:micro:export:buildFatJar :backend:micro:ai:buildFatJar --no-daemon

      - name: Upload gateway JAR
        uses: actions/upload-artifact@v7
        with:
          name: gateway-jar
          path: backend/gateway/build/libs/gateway-all.jar
          retention-days: 1

      - name: Upload auth JAR
        uses: actions/upload-artifact@v7
        with:
          name: auth-jar
          path: backend/micro/auth/build/libs/auth-all.jar
          retention-days: 1

      - name: Upload documents JAR
        uses: actions/upload-artifact@v7
        with:
          name: documents-jar
          path: backend/micro/documents/build/libs/documents-all.jar
          retention-days: 1

      - name: Upload media JAR
        uses: actions/upload-artifact@v7
        with:
          name: media-jar
          path: backend/micro/media/build/libs/media-all.jar
          retention-days: 1

      - name: Upload export JAR
        uses: actions/upload-artifact@v7
        with:
          name: export-jar
          path: backend/micro/export/build/libs/export-all.jar
          retention-days: 1

      - name: Upload AI JAR
        uses: actions/upload-artifact@v4
        with:
          name: ai-jar
          path: backend/micro/ai/build/libs/ai-all.jar
          retention-days: 1

  push-gateway:
    name: Push gateway image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v8
        with:
          name: gateway-jar
          path: backend/gateway/build/libs

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/640912732949/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-deployer@writeopia.iam.gserviceaccount.com'
          token_format: 'access_token'

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/writeopia/writeopia-backend
            europe-west4-docker.pkg.dev/writeopia/writeopia-images/writeopia-backend
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: europe-west4-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/gateway
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  push-auth:
    name: Push auth image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v8
        with:
          name: auth-jar
          path: backend/micro/auth/build/libs

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/640912732949/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-deployer@writeopia.iam.gserviceaccount.com'
          token_format: 'access_token'

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            europe-west4-docker.pkg.dev/writeopia/writeopia-images/writeopia-auth
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: europe-west4-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/micro/auth
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  push-documents:
    name: Push documents image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v8
        with:
          name: documents-jar
          path: backend/micro/documents/build/libs

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/640912732949/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-deployer@writeopia.iam.gserviceaccount.com'
          token_format: 'access_token'

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            europe-west4-docker.pkg.dev/writeopia/writeopia-images/writeopia-documents
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: europe-west4-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/micro/documents
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  push-media:
    name: Push media image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v8
        with:
          name: media-jar
          path: backend/micro/media/build/libs

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/640912732949/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-deployer@writeopia.iam.gserviceaccount.com'
          token_format: 'access_token'

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            europe-west4-docker.pkg.dev/writeopia/writeopia-images/writeopia-media
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: europe-west4-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/micro/media
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  push-export:
    name: Push export image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v8
        with:
          name: export-jar
          path: backend/micro/export/build/libs

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/640912732949/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-deployer@writeopia.iam.gserviceaccount.com'
          token_format: 'access_token'

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            europe-west4-docker.pkg.dev/writeopia/writeopia-images/writeopia-export
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: europe-west4-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend/micro/export
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

  push-ai:
    name: Push AI image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: ai-jar
          path: backend/micro/ai/build/libs

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/640912732949/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-deployer@writeopia.iam.gserviceaccount.com'
          token_format: 'access_token'

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            europe-west4-docker.pkg.dev/writeopia/writeopia-images/writeopia-ai
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v4
        with:
