name: Publish Backend

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    tags:
      - 'v*'

jobs:
  build-and-push:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            gradle_module: ':backend:gateway:buildFatJar'
            context: './backend/gateway'
            image: writeopia-backend
            ghcr: true
          - service: auth
            gradle_module: ':backend:micro:auth:buildFatJar'
            context: './backend/micro/auth'
            image: writeopia-auth
            ghcr: false
          - service: documents
            gradle_module: ':backend:micro:documents:buildFatJar'
            context: './backend/micro/documents'
            image: writeopia-documents
            ghcr: false
          - service: media
            gradle_module: ':backend:micro:media:buildFatJar'
            context: './backend/micro/media'
            image: writeopia-media
            ghcr: false
          - service: export
            gradle_module: ':backend:micro:export:buildFatJar'
            context: './backend/micro/export'
            image: writeopia-export
            ghcr: false
          - service: ai
            gradle_module: ':backend:micro:ai:buildFatJar'
            context: './backend/micro/ai'
            image: writeopia-ai
            ghcr: false
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: adopt
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build ${{ matrix.service }}
        run: ./gradlew ${{ matrix.gradle_module }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/640912732949/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider'
          service_account: 'github-actions-deployer@writeopia.iam.gserviceaccount.com'
          token_format: 'access_token'

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            europe-west4-docker.pkg.dev/writeopia/writeopia-images/${{ matrix.image }}
            ${{ matrix.ghcr && format('ghcr.io/writeopia/{0}', matrix.image) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=sha

      - name: Log in to GitHub Container Registry
        if: matrix.ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Google Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: europe-west4-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
