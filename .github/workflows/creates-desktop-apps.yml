name: Create apps

on:
  workflow_dispatch:

jobs:
  create_msi_app:
    name: Create MSI App
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Generate windows app
        run: ./gradlew packageReleaseMsi
        env:
          WR_POSTHOG_PROJECT_TOKEN: ${{ secrets.WR_POSTHOG_PROJECT_TOKEN }}
      - name: upload unsigned artifact
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          name: Writeopia-windows
          path: application/composeApp/build/compose/binaries/main-release/msi
      - id: optional_step_id
        name: Sign Windows app
        uses: signpath/github-action-submit-signing-request@v3.0
        with:
          api-token: '${{ secrets.SIGN_PATH_API_TOKEN }}'
          organization-id: '${{ secrets.SIGN_PATH_ORG_ID }}'
          project-slug: 'Writeopia'
          signing-policy-slug: 'test-signing'
          github-artifact-id: '${{ steps.upload-unsigned-artifact.outputs.artifact-id }}'
          artifact-configuration-slug: 'msisign'
          wait-for-completion: true
  create_deb_app:
    name: Create Deb App
    runs-on: ubuntu-22.04
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Generate linux app
        run: ./gradlew packageReleaseDeb
        env:
          WR_POSTHOG_PROJECT_TOKEN: ${{ secrets.WR_POSTHOG_PROJECT_TOKEN }}
      - name: Upload App
        uses: actions/upload-artifact@v7
        with:
          name: Writeopia-deb
          path: application/composeApp/build/compose/binaries/main-release/deb/
